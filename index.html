<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Vansaba - 一段階 + 速度</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="speed-bar" class="hidden">
    <button id="speedBtn" class="speed-btn">1.0x</button>
  </div>
  <div id="levelup" class="hidden">
    <h2>LEVEL UP!</h2>
    <p>強化を選んでください</p>
    <div id="choices"></div>
  </div>
  <div id="overlay">
    <h1 id="overlay-title">Vansaba</h1>
    <p id="overlay-msg">タップ / クリックで開始</p>
    <div id="overlay-help">
      <p>・PC：マウス位置へ移動</p>
      <p>・スマホ：画面をドラッグしてスティック操作</p>
      <p>・攻撃は自動</p>
      <p>・レベルアップで3択強化</p>
    </div>
    <button id="startBtn">START</button>
  </div>
  <script src="./audio.js"></script>
  <script src="./game-core.js"></script>
  <script src="./game-draw.js"></script>
</body>
</html>
